async function renderLobby(){stopChannels();await loadGameState();if(!currentGame)return renderDashboard();const fr=await loadFriends();const accepted=(fr.rows||[]).filter(x=>x.status==='accepted').map(x=>{const uid=x.requester_id===me.id?x.addressee_id:x.requester_id;return fr.profiles[uid]}).filter(Boolean);const friendHtml=accepted.length?accepted.map(f=>'<div class="row">'+avatar(f)+'<div class="grow"><b>'+esc(f.display_name)+'</b><div class="pid">'+esc(f.player_id)+'</div></div><button class="btn gold" data-friendinvite="'+esc(f.player_id)+'">Inviter</button></div>').join(''):'<div class="muted">Aucun ami accept\u00e9 pour le moment.</div>';app.innerHTML='<div class="shell">'+topbar('<button class="btn red" id="abandonBtn">Abandonner</button>')+'<div class="grid lobby"><main class="card"><div class="muted">CODE DU SALON</div><div class="code">'+esc(currentGame.code)+'</div><div class="notice" style="margin:8px 0 14px">'+(currentGame.visibility==='private'?'\ud83d\udd12 Partie priv\u00e9e : entr\u00e9e par invitation ou code.':'\ud83c\udf0d Partie publique : visible dans les salons ouverts.')+'</div><h3>Joueurs</h3><div class="player-grid" id="lobbyPlayers"></div></main><aside class="card light"><h3>Inviter mes amis</h3><div class="list" id="lobbyFriendList">'+friendHtml+'</div><hr style="border:0;border-top:1px solid #dce8e7;margin:16px 0"><details><summary style="cursor:pointer;font-weight:800">Inviter avec un ID MAR\u00c9Y</summary><div class="field"><label>ID MAR\u00c9Y</label><input id="inviteId" placeholder="MRY-XXXX-XXXX"></div><button class="btn gold" id="inviteBtn">Envoyer</button></details><hr style="border:0;border-top:1px solid #dce8e7;margin:16px 0"><button class="btn green" id="readyBtn" style="width:100%">Pr\u00eat</button><button class="btn blue hide" id="startBtn" style="width:100%;margin-top:8px">D\u00e9marrer la partie</button><div class="notice" style="margin-top:12px">Une invitation re\u00e7ue permet de rejoindre le salon en un clic, sans sa function showAirport(){if(modalRoot.innerHTML)return;const opts=Object.entries(PROPS).filter(x=>x[1][2]!=='service').map(x=>'<option value="'+x[0]+'">'+esc(x[1][0])+'</option>').join('');showModal('<h3>\u2708\ufe0f A\u00e9roport</h3><p>Pour <b>100 M</b>, voyage vers une commune. Pas de bonus D\u00e9part et une propri\u00e9t\u00e9 libre ne peut pas \u00eatre achet\u00e9e via ce d\u00e9placement.</p><div class="field"><select id="airDest">'+opts+'</select></div><div class="modal-actions"><button class="btn blue" id="airGo">Voyager</button><button class="btn gray" id="airStay">Rester ici</button></div>');document.getElementById('airGo').onclick=async()=>{try{await api(GAME,{action:'airport_travel',game_id:currentGame.id,property_key:document.getElementById('airDest').value});modalRoot.innerHTML=''}catch(e){toast(e.message)}};document.getElementById('airStay').onclick=async()=>{try{await api(GAME,{action:'airport_stay',game_id:currentGame.id});modalRoot.innerHTML=''}catch(e){toast(e.message)}}}

function showAuctionStart(key){

}
async function quickBid(step,allIn=false){
 const a=activeAuctionUI;if(!a)return;
 const mine=players.find(p=>p.user_id===me.id);if(!mine)return;
 const base=a.current_bid!=null?Number(a.current_bid):Number(a.starting_bid)-Number(a.min_increment||10);
 const amount=allIn?Number(mine.cash):base+Number(step);
 const min=a.current_bid?Number(a.current_bid)+Number(a.min_increment):Number(a.starting_bid);
 if(amount<min)return toast('Offre minimale '+min+' M');
 try{await api(MARKET,{action:'bid',game_id:currentGame.id,auction_id:a.id,amount});await loadGameState();loadMarketPanels()}catch(e){toast(e.message)}
}
async function withdrawAuction(){
 const a=activeAuctionUI;if(!a)return;
 try{await api(MARKET,{action:'withdraw',game_id:currentGame.id,auction_id:a.id});toast('Tu ne participes plus \u00e0 cette ench\u00e8re');loadMarketPanels()}catch(e){toast(e.message)}
}
async function renderAuctionOverlay(a){
 const ov=document.getElementById('auctionOverlay');if(!ov)return;
 activeAuctionUI=a;
 const sec=Math.max(0,Math.ceil((new Date(a.closes_at).getTime()-Date.now())/1000)),cfg=PROPS[a.property_key];
 const [{data:bids},{data:wd}]=await Promise.all([
   sb.from('auction_bids').select('*').eq('auction_id',a.id).order('created_at',{ascending:false}).limit(5),
   sb.from('auction_withdrawals').select('user_id').eq('auction_id',a.id).eq('user_id',me.id).maybeSingle()
 ]);
 const mine=players.find(p=>p.user_id===me.id),seller=a.seller_id===me.id,withdrawn=!!wd,bidder=players.find(p=>p.user_id===a.current_bidder_id);
 const history=(bids||[]).map(b=>{const p=players.find(x=>x.user_id===b.bidder_id);return '<div class="auction-bidrow"><span>'+esc(p?pname(p):'Joueur')+'</span><b>'+b.amount+' M</b></div>'}).join('')||'<div class="muted">Aucune offre pour le moment.</div>';
 ov.classList.remove('hide');
 ov.innerHTML='<div class="auction-card"><div class="auction-head"><div><div class="muted">ENCH\u00c8RE \u2014 JEU EN PAUSE</div><h2 style="margin:4px 0">'+esc(cfg?.[0]||a.property_key)+'</h2><div>'+(a.source==='bank'?'Vente de la banque':'Vente d\u2019un joueur')+'</div></div><div class="auction-timer">'+sec+' s</div></div><div class="auction-price">'+(a.current_bid?Number(a.current_bid):Number(a.starting_bid))+' M</div><div><b>Meilleur ench\u00e9risseur :</b> '+esc(bidder?pname(bidder):(a.current_bid?'Joueur':'aucun'))+'</div><div class="auction-paused">\u23f8 Tous les d\u00e9placements et le chrono du tour sont suspendus jusqu\u2019\u00e0 la fin.</div>'+(!seller&&!withdrawn?'<div class="auction-actions"><button class="btn gold" data-qbid="10">+10 M</button><button class="btn gold" data-qbid="20">+20 M</button><button class="btn gold" data-qbid="50">+50 M</button><button class="btn gold" data-qbid="100">+100 M</button><button class="btn blue" id="bidMax">MAX '+Number(mine?.cash||0)+' M</button><button class="btn gray" id="bidWithdraw">Se retirer</button></div>':seller?'<div class="notice">Tu es le vendeur : tu regardes l\u2019ench\u00e8re en direct.</div>':'<div class="notice">Tu t\u2019es retir\u00e9. Tu peux suivre l\u2019ench\u00e8re jusqu\u2019\u00e0 sa fin.</div>')+'<div class="auction-bids"><b>Derni\u00e8res offres</b>'+history+'</div></div>';
 ov.querySelectorAll('[data-qbid]').forEach(b=>b.onclick=()=>quickBid(+b.dataset.qbid,false));
 document.getElementById('bidMax')?.addEventListener('click',()=>quickBid(0,true));
 document.getElementById('bidWithdraw')?.addEventListener('click',withdrawAuction);
}
async function loadMarketPanels(){
 const ael=document.getElementById('auctionList'),tel=document.getElementById('tradeList');if(!ael||!tel||!currentGame)return;
 if(currentGame.host_id===me.id)await api(MARKET,{action:'bot_tick',game_id:currentGame.id}).catch(()=>{});
 const [{data:auctions},{data:trades}]=await Promise.all([
   sb.from('auctions').select('*').eq('game_id',currentGame.id).eq('status','open').order('opened_at',{ascending:false}),
   sb.from('trades').select('*').eq('game_id',currentGame.id).eq('status','pending').order('created_at',{ascending:false})
 ]);
 const now=Date.now(),all=auctions||[],live=all.filter(a=>new Date(a.closes_at).getTime()>now);
 if(all.some(a=>new Date(a.closes_at).getTime()<=now))await api(MARKET,{action:'close_expired',game_id:currentGame.id}).catch(()=>{});
 if(live[0])await renderAuctionOverlay(live[0]);else{activeAuctionUI=null;document.getElementById('auctionOverlay')?.classList.add('hide');await loadGameState().catch(()=>{});updateTurnClock()}
 ael.innerHTML=live.length?live.map(a=>'<div class="row"><div class="grow"><b>'+esc(PROPS[a.property_key]?.[0]||a.property_key)+'</b><div class="muted">Ench\u00e8re en cours au centre de l\u2019\u00e9cran</div></div></div>').join(''):'<div class="muted">Aucune ench\u00e8re.</div>';
 tel.innerHTML=(trades||[]).length?(trades||[]).map(t=>{const incoming=t.recipient_id===me.id,op=players.find(x=>x.user_id===(incoming?t.proposer_id:t.recipient_id)),otherName=op?pname(op):'Joueur';const give=incoming?t.proposer_properties:t.recipient_properties,take=incoming?t.recipient_properties:t.proposer_properties;return '<div class="row"><div class="grow"><b>'+(incoming?'Offre de ':'Offre \u00e0 ')+esc(otherName)+'</b><div class="muted">'+esc((give||[]).map(k=>PROPS[k]?.[0]||k).join(', ')||'\u2014')+' \u2194 '+esc((take||[]).map(k=>PROPS[k]?.[0]||k).join(', ')||'\u2014')+' \u2022 '+(incoming?t.proposer_cash:t.recipient_cash)+' M / '+(incoming?t.recipient_cash:t.proposer_cash)+' M</div></div>'+(incoming?'<button class="btn green" data-trade-yes="'+t.id+'">Accepter</button><button class="btn red" data-trade-no="'+t.id+'">Refuser</button>':'<span class="badge">en attente</span>')+'</div>'}).join(''):'<div class="muted">Aucune offre.</div>';
 tel.querySelectorAll('[data-trade-yes]').forEach(b=>b.onclick=()=>respondTrade(b.dataset.tradeYes,true));tel.querySelectorAll('[data-trade-no]').forEach(b=>b.onclick=()=>respondTrade(b.dataset.tradeNo,false));
}
function showTradeModal(){const others=players.filter(p=>p.user_id!==me.id&&p.status==='active');const mine=owned.filter(x=>x.owner_id===me.id&&x.buildings===0);if(!others.length)return toast('Aucun autre joueur actif');const playerOpts=others.map(p=>'<option value="'+p.user_id+'">'+esc(pname(p))+'</option>').join('');const ownOpts='<option value="">Aucun</option>'+mine.map(x=>'<option value="'+x.property_key+'">'+esc(PROPS[x.property_key]?.[0]||x.property_key)+'</option>').join('');showModal('<h3>Proposer un \u00e9change</h3><div class="field"><label>Joueur</label><select id="trPlayer">'+playerOpts+'</select></div><div class="field"><label>Ton terrain</label><select id="trMine">'+ownOpts+'</select></div><div class="field"><label>Tu ajoutes</label><input id="trCashGive" type="number" min="0" step="10" value="0"></div><div class="field"><label>Terrain demand\u00e9</label><select id="trTheir"><option value="">Aucun</option></select></div><div class="field"><label>M demand\u00e9s</label><input id="trCashTake" type="number" min="0" step="10" value="0"></div><div class="modal-actions"><button class="btn blue" id="trGo">Envoyer</button><button class="btn gray" data-close>Annuler</button></div>');const fill=()=>{const uid=document.getElementById('trPlayer').value,theirs=owned.filter(x=>x.owner_id===uid&&x.buildings===0);document.getElementById('trTheir').innerHTML='<option value="">Aucun</option>'+theirs.map(x=>'<option value="'+x.property_key+'">'+esc(PROPS[x.property_key]?.[0]||x.property_key)+'</option>').join('')};document.getElementById('trPlayer').onchange=fill;fill();document.getElementById('trGo').onclick=async()=>{const their=document.getElementById('trTheir').value,mine=document.getElementById('trMine').value,give=+document.getElementById('trCashGive').value,take=+document.getElementById('trCashTake').value;if(!mine&&!their&&!give&&!take)return toast('Proposition vide');try{await api(MARKET,{action:'create_trade',game_id:currentGame.id,recipient_id:document.getElementById('trPlayer').value,proposer_properties:mine?[mine]:[],recipient_properties:their?[their]:[],proposer_cash:give,recipient_cash:take});modalRoot.innerHTML='';toast('Proposition envoy\u00e9e');loadMarketPanels()}catch(e){toast(e.message)}}}
async function respondTrade(id,accept){try{await api(MARKET,{action:'respond_trade',game_id:currentGame.id,trade_id:id,accept});toast(accept?'\u00c9change accept\u00e9':'\u00c9change refus\u00e9');await loadGameState();refreshGameUI(false)}catch(e){toast(e.message)}}
async function loadChat(){const e=document.getElementById('chatBox');if(!e)return;const {data:m}=await sb.from('game_messages').select('*').eq('game_id',currentGame.id).order('id',{ascending:false}).limit(20);e.innerHTML=(m||[]).reverse().map(x=>'<div><b>'+esc(profiles[x.sender_id]?.display_name||'Joueur')+':</b> '+esc(x.body)+'</div>').join('');e.scrollTop=e.scrollHeight}
async function sendChat(){const i=document.getElementById('chatInput'),v=i.value.trim();if(!v)return;try{await api(GAME,{action:'send_message',game_id:currentGame.id,body:v});i.value=''}catch(e){toast(e.message)}}
async function renderFinal(){
 stopChannels();await loadGameState();
 const vals={},propCounts={},buildingCounts={};
 for(const p of players){let v=p.cash,pc=0,bc=0;for(const x of owned.filter(z=>z.owner_id===p.user_id)){const q=PROPS[x.property_key];if(q){v+=q[1]+(q[3]||0)*(x.buildings||0);pc++;bc+=x.buildings||0}}vals[p.user_id]=v;propCounts[p.user_id]=pc;buildingCounts[p.user_id]=bc}
 const sorted=[...players].sort((a,b)=>{if(a.status==='winner')return-1;if(b.status==='winner')return 1;if(a.elimination_order&&b.elimination_order)return b.elimination_order-a.elimination_order;if(a.elimination_order)return 1;if(b.elimination_order)return-1;return vals[b.user_id]-vals[a.user_id]});
 const statusText=p=>p.status==='winner'?'gagnant':p.status==='bankrupt'?'faillite':p.status==='left'?'abandonn\u00e9':'solvable';
 app.innerHTML='<div class="shell">'+topbar()+'<section class="card light" style="max-width:880px;margin:auto"><div class="podium">\ud83c\udfc6 Classement final</div><p>Du gagnant au perdant, avec patrimoine et bilan de partie.</p><div class="final-list">'+sorted.map((p,i)=>'<div class="rank"><b style="font-size:24px">#'+(i+1)+'</b><div>'+pavatar(p)+' <b>'+esc(pname(p))+'</b><div class="muted">'+(p.is_bot?'BOT':esc(profiles[p.user_id]?.player_id||''))+' \u2022 '+statusText(p)+' \u2022 '+propCounts[p.user_id]+' terrain(s) \u2022 '+buildingCounts[p.user_id]+' b\u00e2timent(s)</div></div><b>'+vals[p.user_id]+' M</b></div>').join('')+'</div><div class="modal-actions"><button class="btn blue" id="homeFinal">Accueil</button></div></section></div>';
 bindTop();document.getElementById('homeFinal').onclick=renderDashboard
}
let ac=null;function audio(){if(!soundOn)return null;ac=ac||new AudioContext();return ac}function tone(f,d=.12,type='sine',gain=.05,delay=0){const a=audio();if(!a)return;const o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(0,a.currentTime+delay);g.gain.linearRampToValueAtTime(gain,a.currentTime+delay+.01);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+delay+d);o.connect(g).connect(a.destination);o.start(a.currentTime+delay);o.stop(a.currentTime+delay+d+.02)}function noise(d=.18,gain=.025){const a=audio();if(!a)return;const b=a.createBuffer(1,a.sampleRate*d,a.sampleRate),x=b.getChannelData(0);for(let i=0;i<x.length;i++)x[i]=(Math.random()*2-1)*(1-i/x.length);const s=a.createBufferSource(),gn=a.createGain();gn.gain.value=gain;s.buffer=b;s.connect(gn).connect(a.destination);s.start()}
function soundFor(pos){const k=BOARD[pos]?.[1];if(!soundOn)return;if(k==='smgeag'){noise(.4,.04);tone(180,.25,'sine',.03)}else if(k==='edf'){tone(60,.25,'sawtooth',.025);tone(120,.12,'square',.015,.1)}else if(k==='airport'){noise(.35,.02);tone(220,.35,'sawtooth',.02)}else if(k==='jail'||k==='jail2'){tone(150,.18,'square',.05);tone(90,.28,'square',.04,.08)}else if(k==='chance'){tone(480,.1,'triangle',.04);tone(620,.12,'triangle',.04,.08)}else if(k==='capesterre'||k==='deshaies'||k==='le-gosier'){noise(.28,.025);tone(520,.08,'sine',.02,.12)}else if(k==='baie-mahault'){tone(210,.08,'square',.04);tone(160,.1,'square',.03,.09)}else if(k==='pointe-noire'||k==='marie-galante'){tone(260,.07,'triangle',.045);tone(390,.07,'triangle',.04,.1)}else{tone(300,.06,'triangle',.035);tone(440,.08,'triangle',.03,.08)}}function soundChance(id){if(id==='hugo'){noise(.8,.07);tone(70,.7,'sawtooth',.03)}else{tone(420,.12,'triangle',.04);tone(600,.14,'triangle',.04,.1)}}
(async()=>{const {data:{session}}=await sb.auth.getSession();if(session){await initUser();renderDashboard()}else renderLanding();sb.auth.onAuthStateChange(async(_e,s)=>{if(s&&!me){await initUser();renderDashboard()}})})();
